name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (no model extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests scripts
      - name: Unit + API tests (heuristic planner)
        run: python -m pytest -q tests --ignore=tests/test_model.py
      - name: Data integrity (gold answers vs. corpus, split leakage)
        run: python scripts/check_data.py
      - name: Numbers in README match artifacts
        run: python scripts/check_numbers.py
  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image (heuristic)
        run: docker build --build-arg COMMIT=${GITHUB_SHA::7} -t tabletrace:ci .
      - name: Smoke run
        run: |
          docker run -d --rm --name tt -p 8000:8000 -e TABLETRACE_PLANNER=heuristic tabletrace:ci
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8000/v1/health && break; sleep 2; done
          curl -sf http://127.0.0.1:8000/v1/release
          curl -sf -X POST "http://127.0.0.1:8000/v1/ask?wait=1" -H 'content-type: application/json' \
            -d '{"question":"What is the critical pressure of ammonia?","corpus":"chem_docs","table_id":"chem_m68769_t0"}' | grep -q '"answer":"11,300"'
          curl -sf http://127.0.0.1:8000/ | grep -q "TableTrace"
          docker stop tt
